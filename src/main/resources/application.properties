# Application
spring.application.name=proproject
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/springAI
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:7a3f9c2e1b8d4f6a0e5c7b9d2f4a8c1e3b6d8f0a2c4e7b9f1d3a5c7e9b0d2f4}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Google Gemini AI Configuration
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:your_google_gemini_api_key}
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_MODEL:gemini-3.8-flash}

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false